# ~/microcloud/compose.yml
# TechNova Micro-Cloud Node – AB 4: Docker Compose & Vernetzung im komm-Netz
# Start:  sudo docker compose up -d
# Status: sudo docker compose ps
# Logs:   sudo docker compose logs -f
# Stopp:  sudo docker compose down

services:
  # Webserver mit eigener Status-Seite (./html/index.html)
  web:
    image: nginx:alpine
    container_name: technova-web
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro

  # Bonus (Aufgabe 4): Uptime Kuma Monitoring-Dashboard
  kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./kuma-data:/app/data
